name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DEPLOY_KEY_B64: 

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY_B64" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 106.15.45.101 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload files to server
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -r dist/* root@106.15.45.101:/opt/1panel/www/love.buffapi.cn/

      - name: Reload OpenResty
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no root@106.15.45.101 "docker exec 1Panel-openresty-7wHw nginx -s reload && echo 'RELOAD OK'"
